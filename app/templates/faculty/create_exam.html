{% extends "base.html" %}
{% block title %}Create Examination - {{ platform_name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold text-primary mb-0">
                        <i class="bi bi-calendar2-plus me-2"></i> Configure & Schedule Examination
                    </h5>
                </div>

                <div class="card-body p-4">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="row g-3 mb-3">
                            <div class="col-12">
                                <label class="form-label small fw-semibold text-muted">Examination Official Title</label>
                                <input type="text" class="form-control" name="title" required placeholder="e.g. Mid-Term Assessment: Data Structures & Algorithms">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label small fw-semibold text-muted">Course Program</label>
                                <select class="form-select" name="course_id" required>
                                    {% for c in courses %}
                                        <option value="{{ c.id }}">{{ c.name }} ({{ c.code }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label small fw-semibold text-muted">Branch / Discipline</label>
                                <select class="form-select" name="branch_id" required>
                                    {% for b in branches %}
                                        <option value="{{ b.id }}">{{ b.name }} ({{ b.code }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label small fw-semibold text-muted">Semester</label>
                                <select class="form-select" name="semester" required>
                                    {% for s in range(1, 9) %}
                                        <option value="{{ s }}" {% if s == 3 %}selected{% endif %}>Semester {{ s }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-8">
                                <label class="form-label small fw-semibold text-muted">Curriculum Subject</label>
                                <select class="form-select" name="subject_id" required>
                                    {% for s in subjects %}
                                        <option value="{{ s.id }}">{{ s.name }} ({{ s.code }}) - Sem {{ s.semester }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label small fw-semibold text-muted">Exam Date</label>
                                <input type="date" class="form-control" name="exam_date" value="2026-11-20" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label small fw-semibold text-muted">Start Time</label>
                                <input type="time" class="form-control" name="start_time" value="09:00" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label small fw-semibold text-muted">End Time</label>
                                <input type="time" class="form-control" name="end_time" value="11:00" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label small fw-semibold text-muted">Duration (Minutes)</label>
                                <input type="number" class="form-control" name="duration_minutes" value="60" min="5" max="300" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label small fw-semibold text-muted">Passing Percentage (%)</label>
                                <input type="number" class="form-control" name="passing_percentage" value="40" min="1" max="100" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label small fw-semibold text-muted">Maximum Allowed Attempts</label>
                                <input type="number" class="form-control" name="max_attempts" value="1" min="1" max="5" required>
                            </div>

                            <div class="col-md-4">
                                <div class="form-check mt-4">
                                    <input class="form-check-input" type="checkbox" id="negMarkCheck" name="negative_marking">
                                    <label class="form-check-label fw-semibold text-dark small" for="negMarkCheck">
                                        Enable Negative Marking
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label small fw-semibold text-muted">Negative Marks Per Wrong Answer</label>
                                <input type="number" step="0.05" class="form-control" name="negative_mark_value" value="0.25">
                            </div>

                            <div class="col-12">
                                <label class="form-label small fw-semibold text-muted">Candidate Examination Instructions</label>
                                <textarea class="form-control" name="instructions" rows="4">1. This examination contains Multiple Choice Questions.
2. Each question possesses four options with only one correct response.
3. Timer is enforced strictly on the server; answers auto-save as you proceed.
4. Switching browser tabs or exiting fullscreen will trigger integrity warnings logged for faculty review.
5. Click 'Submit Examination' upon finishing or await automatic submission upon timer expiry.</textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a href="{{ url_for('faculty.dashboard') }}" class="btn btn-outline-secondary px-3">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">Save Draft & Add Questions &rarr;</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
