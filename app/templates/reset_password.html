{% extends "base.html" %}
{% block title %}Set New Password - {{ platform_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">
            <div class="card border-0 shadow-sm" style="border-radius: 10px;">
                <div class="card-header bg-white text-center py-4 border-bottom">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-light p-3 mb-2" style="width: 58px; height: 58px;">
                        <i class="bi bi-key-fill text-success fs-2"></i>
                    </div>
                    <h4 class="fw-bold text-primary mb-1">Set New Account Password</h4>
                    <p class="text-secondary small mb-0">{{ platform_name }}</p>
                </div>

                <div class="card-body p-4">
                    <div class="alert alert-light border small text-secondary py-2 mb-3">
                        <i class="bi bi-person-check text-primary me-1"></i>
                        Updating credentials for: <strong>{{ user.identifier }}</strong> ({{ user.email }})
                    </div>

                    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-secondary text-uppercase mb-1">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" name="password" id="reset_password" required minlength="8" placeholder="Enter new password (min. 8 chars)">
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('reset_password', 'toggle_reset_icon1')">
                                    <i class="bi bi-eye" id="toggle_reset_icon1"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-secondary text-uppercase mb-1">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" name="confirm_password" id="reset_confirm" required minlength="8" placeholder="Confirm new password">
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('reset_confirm', 'toggle_reset_icon2')">
                                    <i class="bi bi-eye" id="toggle_reset_icon2"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-check2-circle me-1"></i> Update Password & Sign In
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top text-center">
                        <a href="{{ url_for('auth.login') }}" class="small text-decoration-none text-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Return to Sign In
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function togglePasswordVisibility(fieldId, iconId) {
        const field = document.getElementById(fieldId);
        const icon = document.getElementById(iconId);
        if (field && icon) {
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    }
</script>
{% endblock %}
