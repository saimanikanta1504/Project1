{% extends "base.html" %}
{% block title %}Page Not Found (404) - {{ platform_name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-5">
                <div class="display-1 text-primary font-monospace fw-bold mb-3">404</div>
                <h3 class="fw-bold mb-3">Resource Not Found</h3>
                <p class="text-secondary mb-4">
                    The requested examination page, module, or institutional record could not be found or has been moved.
                </p>
                <div>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 py-2">Return to Homepage</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
